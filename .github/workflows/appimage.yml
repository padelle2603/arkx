name: AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    # gtk4-rs 0.9 needs GTK >= 4.12; Ubuntu 22.04 ships 4.6. The runner also
    # provides the glibc baseline the bundle is portable to.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev pkg-config \
            p7zip-full libarchive-tools file desktop-file-utils zsync \
            librsvg2-bin

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Cargo.toml is canonical. A tag that disagrees would silently ship a
      # release named after one version and containing another.
      - name: Version
        run: |
          version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          echo "ARKX_VERSION=${version}" >> "$GITHUB_ENV"
          echo "ARKX_APPIMAGE=Arkx-v${version}-x86_64.AppImage" >> "$GITHUB_ENV"
          echo "building $ARKX_APPIMAGE"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match Cargo.toml ${version}"
            exit 1
          fi

      - name: Checks (fail before packaging)
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --locked
          desktop-file-validate data/arkx.desktop

      - name: linuxdeploy + GTK plugin
        run: |
          curl -sSfL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSfL -o linuxdeploy-plugin-gtk.sh https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy linuxdeploy-plugin-gtk.sh
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Compile
        run: cargo build --release --locked

      # AppDir layout is the packaging: everything below is what ends up in
      # the AppImage, so it lives here and not in a script the repo carries.
      - name: Deploy into AppDir
        run: |
          # `7z` is a shell wrapper on most distributions and the real binary
          # moved between releases; linuxdeploy only accepts an ELF, so pick
          # the first one that actually is one.
          SEVEN=""
          for cand in "$(command -v 7z)" /usr/bin/7zz /usr/lib/7zip/7z \
                      /usr/bin/7za /usr/bin/7zr; do
            [ -x "$cand" ] || continue
            case "$(file -b "$cand")" in *ELF*) SEVEN="$cand"; break ;; esac
          done
          [ -n "$SEVEN" ] || { echo "no ELF 7z binary found"; exit 1; }
          echo "7z binary: $SEVEN"

          # linuxdeploy-plugin-gtk installs an AppRun hook that forces
          # GDK_BACKEND=x11, GTK_THEME=Adwaita and REPLACES GSETTINGS_SCHEMA_DIR.
          # Arkx carries its own palette: none of the three is needed, and all
          # three make the bundled GUI render differently from the installed
          # binary.
          #
          # It has to exist BEFORE linuxdeploy runs: linuxdeploy writes the
          # `source` line for every hook it finds in apprun-hooks/ into the
          # AppRun, at the end of its own run. Create it afterwards and the
          # AppRun never mentions it, silently, which is what v1.6.4 shipped.
          mkdir -p AppDir/apprun-hooks
          cat > AppDir/apprun-hooks/zzz-arkx.sh <<'HOOK'
          #!/usr/bin/env bash
          # An explicit override wins over everything, and it is what makes the
          # difference diagnosable: ARK_GDK_BACKEND=x11 reproduces what the
          # bundle used to do on every launch.
          if [ -n "${ARK_GDK_BACKEND:-}" ]; then
            export GDK_BACKEND="$ARK_GDK_BACKEND"
          else
            unset GDK_BACKEND
          fi
          if [ -n "${ARK_GTK_THEME:-}" ]; then
            export GTK_THEME="$ARK_GTK_THEME"
          else
            unset GTK_THEME
          fi
          if [ -d /usr/share/glib-2.0/schemas ]; then
            export GSETTINGS_SCHEMA_DIR="${GSETTINGS_SCHEMA_DIR:+$GSETTINGS_SCHEMA_DIR:}/usr/share/glib-2.0/schemas"
          fi
          HOOK
          chmod +x AppDir/apprun-hooks/zzz-arkx.sh

          # Every binary goes through linuxdeploy so its shared libraries get
          # resolved. Copying 7z by hand left it without its codecs: on Ubuntu
          # 24.04 p7zip-full is transitional and 7zip 23.01 does not ship
          # /usr/lib/p7zip, so RAR/ISO/CAB extraction would silently fail.
          ./linuxdeploy --appdir AppDir \
            -e target/release/arkx \
            -e "$SEVEN" \
            -e "$(command -v bsdtar)" \
            -d data/arkx.desktop \
            -i data/icons/hicolor/256x256/apps/arkx.png \
            --plugin gtk

          # 7-Zip dlopen()s its codecs and looks for "7z.so" next to its own
          # executable, so no dependency resolver finds it and a copy in
          # usr/lib is not enough. Without it the binary starts and answers
          # "not implemented" for every format. Some builds (Debian's 7zip
          # 23.01) link the codecs in instead, so this is copy-if-present —
          # the round-trip below is what actually proves it works.
          CODEC=""
          for dir in "$(dirname "$SEVEN")" /usr/lib/p7zip /usr/lib/7zip; do
            for m in "$dir/7z.so" "$dir/Codecs/7z.so"; do
              if [ -f "$m" ]; then CODEC="$m"; break; fi
            done
            [ -n "$CODEC" ] && break
          done
          if [ -n "$CODEC" ]; then
            echo "7z codecs: $CODEC"
            cp "$CODEC" AppDir/usr/bin/7z.so
          else
            echo "no separate 7z codec module; assuming it is linked in"
          fi

          # AppRun does not glob: linuxdeploy writes one `source` line per hook,
          # in the order it found them, and a digit sorts before a letter. So
          # `99-arkx.sh` ran BEFORE the plugin hook, which put GDK_BACKEND=x11
          # and GTK_THEME straight back, and v1.6.4 shipped the behaviour it
          # was meant to fix. Read the order out of the AppRun we just built
          # and fail the build when ours is not last: neither the sort order
          # nor "create it before linuxdeploy" is worth trusting twice. The
          # hook name is quoted inside those lines, so match the file name.
          grep -q 'zzz-arkx\.sh' AppDir/AppRun \
            || { echo "::error::AppRun does not source zzz-arkx.sh at all"; exit 1; }
          plugin_at="$(grep -n 'linuxdeploy-plugin-gtk\.sh' AppDir/AppRun | head -1 | cut -d: -f1 || true)"
          arkx_at="$(grep -n 'zzz-arkx\.sh' AppDir/AppRun | head -1 | cut -d: -f1)"
          if [ -z "$plugin_at" ]; then
            echo "::warning::no plugin source line in AppRun: template changed, check the hook order by hand"
          elif [ "$arkx_at" -le "$plugin_at" ]; then
            echo "::error::AppRun sources our hook at line $arkx_at and the plugin at $plugin_at: ours must come last"
            exit 1
          else
            echo "apprun-hooks: ours (line $arkx_at) runs after the plugin's (line $plugin_at)"
          fi

          mkdir -p AppDir/usr/share/icons AppDir/usr/share/doc/arkx \
                   AppDir/usr/share/kio/servicemenus
          cp -r data/icons/hicolor AppDir/usr/share/icons/
          cp data/arkx.desktop AppDir/
          cp data/icons/hicolor/256x256/apps/arkx.png AppDir/arkx.png
          cp LEGAL.md PRIVACY.md README.md AppDir/usr/share/doc/arkx/
          # Templates also ship inside the binary (include_str!), so the menus
          # work from any install method. This copy just keeps them in the
          # bundle for anyone who extracts it.
          cp data/servicemenus/*.desktop AppDir/usr/share/kio/servicemenus/

      - name: Smoke test inside AppDir
        run: |
          AppDir/usr/bin/arkx --version
          test -x AppDir/usr/bin/7z || { echo "7z missing from AppDir!"; exit 1; }
          test -x AppDir/usr/bin/bsdtar || { echo "bsdtar missing from AppDir!"; exit 1; }
          # `test -x` only proves the file is there. Round-trip a real archive
          # so a bundle without the 7z codecs fails here instead of on a
          # user's desktop the first time they open a RAR.
          mkdir -p /tmp/smoke && head -c 200000 /dev/urandom > /tmp/smoke/blob
          AppDir/usr/bin/7z a /tmp/smoke/out.7z /tmp/smoke/blob >/dev/null
          AppDir/usr/bin/7z l /tmp/smoke/out.7z | grep -q blob
          AppDir/usr/bin/bsdtar -cf /tmp/smoke/out.tar /tmp/smoke/blob
          AppDir/usr/bin/bsdtar -tf /tmp/smoke/out.tar | grep -q blob
          rm -rf /tmp/smoke

      - name: Bake
        run: OUTPUT="$ARKX_APPIMAGE" ./linuxdeploy --appdir AppDir --output appimage

      - name: Smoke test
        run: |
          ls -la "$ARKX_APPIMAGE"
          chmod +x "$ARKX_APPIMAGE"
          ./"$ARKX_APPIMAGE" --version
          # Exit 0 = current, 10 = newer release, 1 = no release published yet
          # or unreachable. A manual run before the first release legitimately
          # gets 1; what we are proving is that the bundle carries working TLS.
          ./"$ARKX_APPIMAGE" --check-update || [ $? -le 10 ]

      # A workflow_dispatch run publishes nothing, so without this the only
      # way to get the artifact out is to cut a release.
      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: arkx-appimage
          path: ${{ env.ARKX_APPIMAGE }}
          if-no-files-found: error

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes are the section of this version in CHANGELOG.md, not GitHub's
          # commit list: --generate-notes published v1.6.3 with a body that
          # said nothing but "Full Changelog". A missing section is a changelog
          # bug, so it fails the job instead of shipping a mute release.
          notes="$(awk -v tag="## $GITHUB_REF_NAME" '
            inside && substr($0, 1, 3) == "## " { exit }
            !inside && substr($0, 1, length(tag)) == tag &&
              (length($0) == length(tag) || substr($0, length(tag) + 1, 1) == " ") { inside = 1; next }
            inside { print }
          ' CHANGELOG.md | sed '/./,$!d')"
          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has no '## $GITHUB_REF_NAME' section"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "$ARKX_APPIMAGE" \
            --title "Arkx $GITHUB_REF_NAME" \
            --notes "$notes"
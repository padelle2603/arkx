name: AppImage

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-4-dev libadwaita-1-dev pkg-config \
            p7zip-full file desktop-file-utils zsync

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Checks (fail fast before packaging)
        run: |
          cargo test --locked
          cargo clippy --locked -- -D warnings
          desktop-file-validate data/arkx.desktop

      - name: linuxdeploy + GTK plugin
        run: |
          curl -sSfL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          curl -sSfL -o linuxdeploy-plugin-gtk.sh https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh
          chmod +x linuxdeploy linuxdeploy-plugin-gtk.sh
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Build AppImage
        run: ./appimage/build-appimage.sh "${GITHUB_REF_NAME#v}"
        env:
          ARCH: x86_64

      - name: Smoke test
        run: |
          IMG="$(ls Arkx-*-x86_64.AppImage | head -1)"
          ls -la "$IMG"
          chmod +x "$IMG"
          ./"$IMG" --version

      - name: Release with AppImage
        uses: softprops/action-gh-release@v2
        with:
          files: Arkx-*-x86_64.AppImage
          generate_release_notes: true
